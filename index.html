<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>薪資單查詢</title>
<style>
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin:0; background-color:#fff; }
  .container { width: 90%; max-width: 700px; text-align:center; }
  .logo { width:180px; margin-bottom:20px; }
  table { width:100%; border-collapse: collapse; }
  td { width:25%; height:40px; text-align:center; vertical-align: middle; font-size:1.2em; word-wrap:break-word; overflow:hidden; text-overflow:ellipsis; }
  h2 { font-size:1.8em; text-align:center; }
  .input-container { margin-bottom:10px; text-align:left; }
  .error { color:red; font-weight:bold; font-size:1.1em; }
  .description { font-size:1.1em; color:black; }
  #progress { margin-top:10px; font-size:1.1em; display:none; }
  #result table { border:2px solid #007bff; border-radius:8px; margin-top:20px; }
  #result td { padding:8px; border:1px solid #ccc; }
</style>
</head>
<body>
<div class="container">
  <img class="logo" src="https://natsumeouo.github.io/fengyuanXinZi/LOGO%E9%80%8F%E6%98%8E%E5%BA%95.png" alt="公司LOGO">
  <form id="payrollForm" onsubmit="fetchPaySlip(); return false;">
    <div class="input-container">
      <label for="idNumber">身分證字號：</label>
      <input type="text" id="idNumber" placeholder="例：A123456789" style="font-size:1.2em;">
    </div>
    <div class="input-container">
      <label for="birthDate">出生年月日：</label>
      <input type="text" id="birthDate" placeholder="例：0780702" style="font-size:1.2em;">
      <div class="description">例：民國78年7月2日，請填0780702。</div>
    </div>
    <div class="input-container">
      <label for="month">薪資單月份：</label>
      <input type="text" id="month" placeholder="例：11401" style="font-size:1.2em;">
      <div class="description">例：民國114年01月薪資，請填11401。</div>
    </div>
    <div><button type="submit" style="font-size:1.2em;">查詢薪資單</button></div>
  </form>
  <div id="progress">查詢中…</div>
  <div id="result"></div>
</div>

<script>
async function fetchPaySlip() {
  const id = document.getElementById("idNumber").value.trim();
  const dob = document.getElementById("birthDate").value.trim();
  const month = document.getElementById("month").value.trim();
  const resultDiv = document.getElementById("result");
  const progressDiv = document.getElementById("progress");

  resultDiv.innerHTML = "";
  progressDiv.style.display = "block";

  // 驗證輸入格式
  if(!/^[A-Z][12][0-9]{8}$/.test(id)) { resultDiv.innerHTML="<p class='error'>身分證字號錯誤</p>"; progressDiv.style.display="none"; return; }
  if(!/^[0-9]{3}(0[1-9]|1[0-2])(0[1-9]|[12][0-9]|3[01])$/.test(dob)) { resultDiv.innerHTML="<p class='error'>出生年月日錯誤</p>"; progressDiv.style.display="none"; return; }
  if(!/^[0-9]{3}(0[1-9]|1[0-2])$/.test(month)) { resultDiv.innerHTML="<p class='error'>月份格式錯誤</p>"; progressDiv.style.display="none"; return; }

  try {
    const url = "https://script.google.com/macros/s/AKfycbzhRLyYLaey92fZqjv7L25uzA-QLG9iZVHoS4NdiqgbBMVQ2QZ4wtuWCfSE6jeqDqw4XQ/exec?id=" +
                encodeURIComponent(id) + "&dob=" + encodeURIComponent(dob) + "&month=" + encodeURIComponent(month);
    const res = await fetch(url);
    const data = await res.json();

    progressDiv.style.display = "none";

    if(!data.name) { resultDiv.innerHTML="<p class='error'>未找到資料</p>"; return; }

    const fragment = document.createDocumentFragment();
    const hName = document.createElement("h2"); hName.textContent = "姓名：" + data.name;
    const hMonth = document.createElement("h2"); hMonth.textContent = "薪資單月份：" + month;
    fragment.appendChild(hName); fragment.appendChild(hMonth);

    const table = document.createElement("table");
    data.details.forEach(detail => {
      const tr = document.createElement("tr");
      // 收入
      if(detail.income[0]==="所得部分" || detail.income[0]==="備註"){
        const td = document.createElement("td"); td.colSpan=2; td.style.textAlign="center"; td.textContent=detail.income[0]||""; tr.appendChild(td);
      } else {
        detail.income.forEach(val=>{ const td=document.createElement("td"); td.textContent=val||""; tr.appendChild(td); });
      }
      // 支出
      if(detail.expense[0]==="支出部分"){
        const td = document.createElement("td"); td.colSpan=2; td.style.textAlign="center"; td.textContent=detail.expense[0]||""; tr.appendChild(td);
      } else {
        detail.expense.forEach(val=>{ const td=document.createElement("td"); td.textContent=val||""; tr.appendChild(td); });
      }
      table.appendChild(tr);
    });

    fragment.appendChild(table);
    resultDiv.appendChild(fragment);

  } catch(e) {
    console.error(e);
    progressDiv.style.display="none";
    resultDiv.innerHTML="<p class='error'>查詢失敗，請稍後再試</p>";
  }
}
</script>
</body>
</html>
