<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>薪資單查詢</title>
<style>
body{font-family:sans-serif;text-align:center;margin:20px;}
input,button{font-size:1.2em;margin:5px;}
.error{color:red;}
#progress-bar{width:0%;height:20px;background:#007bff;color:white;line-height:20px;}
</style>
</head>
<body>

<h1>薪資單查詢</h1>

<input id="idNumber" placeholder="身分證字號">
<input id="birthDate" placeholder="出生年月日 例:0780702">
<input id="month" placeholder="薪資單月份 例:11312">
<br>
<button onclick="fetchPaySlip()">查詢薪資單</button>

<div id="progress-bar"></div>
<div id="result"></div>

<script>
function fetchPaySlip() {
  const id = document.getElementById("idNumber").value.trim();
  const dob = document.getElementById("birthDate").value.trim();
  const month = document.getElementById("month").value.trim();
  const resultDiv = document.getElementById("result");
  const progressBar = document.getElementById("progress-bar");

  // localStorage 快取
  const cacheKey = `${id}_${dob}_${month}`;
  const cached = localStorage.getItem(cacheKey);
  if(cached){
    resultDiv.innerHTML = cached;
    progressBar.style.width="100%";
    return;
  }

  progressBar.style.width="40%";
  progressBar.innerText="查詢中...";

  const url = `https://script.google.com/macros/s/YOUR_DEPLOY_ID/exec?id=${id}&dob=${dob}&month=${month}`;

  fetch(url,{cache:"no-store"})
  .then(r=>r.json())
  .then(data=>{
    progressBar.style.width="100%";
    let html="";
    if(data.error){
      html="<p class='error'>"+data.message+"</p>";
    } else {
      html=`<h2>姓名: ${data.name}</h2><h2>薪資單月份: ${data.month}</h2>`;
      html+="<table border='1' style='width:100%;'>";
      data.details.forEach(d=>{
        html+="<tr>";
        html+=`<td>${d.income[0]||""}</td><td>${d.income[1]||""}</td>`;
        html+=`<td>${d.expense[0]||""}</td><td>${d.expense[1]||""}</td>`;
        html+="</tr>";
      });
      html+="</table>";
      localStorage.setItem(cacheKey,html); // 存快取
    }
    resultDiv.innerHTML=html;
  })
  .catch(()=>resultDiv.innerHTML="<p class='error'>查詢失敗</p>");
}
</script>

</body>
</html>
