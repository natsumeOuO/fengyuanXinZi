<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>薪資單查詢AA</title>

  <style>
    body {
      font-family: Arial;
      display: flex;
      justify-content: center;
      padding: 30px;
    }

    .container {
      width: 100%;
      max-width: 700px;
      text-align: center;
    }

    input {
      padding: 8px;
      margin: 5px;
      width: 80%;
    }

    button {
      padding: 8px 16px;
      cursor: pointer;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    td, th {
      border: 1px solid #ccc;
      padding: 6px;
      font-size: 14px;
    }

    .error {
      color: red;
      font-weight: bold;
      margin-top: 10px;
    }

    #progress {
      display: none;
      margin-top: 10px;
      color: #007bff;
    }
  </style>
</head>

<body>

<div class="container">

  <h2>薪資單查詢</h2>

  <form id="form">
    <input id="idNumber" placeholder="身分證字號">
    <br>
    <input id="birthDate" placeholder="出生年月日（例：0520212）">
    <br>
    <input id="month" placeholder="月份（例：11401）">
    <br>
    <button type="submit">查詢</button>
  </form>

  <div id="progress">查詢中...</div>
  <div id="result"></div>

</div>

<script>

let cache = {};

// =====================
// 防止 reload（關鍵）
// =====================
document.getElementById("form").addEventListener("submit", function(e){
  e.preventDefault();
  fetchData();
});

// =====================
// 主查詢
// =====================
function fetchData() {

  let id = document.getElementById("idNumber").value.trim();
  let dob = document.getElementById("birthDate").value.trim();
  let month = document.getElementById("month").value.trim();

  let result = document.getElementById("result");
  let progress = document.getElementById("progress");

  result.innerHTML = "";
  progress.style.display = "block";

  // =====================
  // 基本檢查
  // =====================
  if (!id || !dob || !month) {
    return showError("請輸入完整資料");
  }

  if (!/^[A-Z][12][0-9]{8}$/.test(id)) {
    return showError("身分證格式錯誤");
  }

  if (!/^[0-9]{6,7}$/.test(dob)) {
    return showError("出生日期格式錯誤");
  }

  if (!/^[0-9]{5}$/.test(month)) {
    return showError("月份格式錯誤");
  }

  // =====================
  // cache
  // =====================
  if (cache[month]) {
    render(cache[month], id, dob, month);
    return;
  }

  fetch("./" + month + ".json")
    .then(res => {
      if (!res.ok) throw new Error("not found");
      return res.json();
    })
    .then(data => {
      cache[month] = data;
      render(data, id, dob, month);
    })
    .catch(err => {
      showError("JSON載入失敗，請確認檔案存在");
    });
}

// =====================
// render
// =====================
function render(data, id, dob, month) {

  document.getElementById("progress").style.display = "none";

  let user = data.find(u =>
    String(u["身分證字號"]).trim() === id &&
    String(u["出生年月日"]).trim() === dob
  );

  if (!user) {
    return showError("查無資料");
  }

  let html = `
    <h3>${user["姓名"]}</h3>
    <p>月份：${month}</p>

    <table>
      <tr>
        <th>所得項目</th>
        <th>金額</th>
        <th>支出項目</th>
        <th>金額</th>
      </tr>
  `;

  for (let i = 1; i <= 10; i++) {

    let iname = user[`所得項目${i}`] || "";
    let ival = user[`所得數值${i}`] || "";

    let oname = user[`支出項目${i}`] || "";
    let oval = user[`支出數值${i}`] || "";

    if (!iname && !oname) continue;

    html += `
      <tr>
        <td>${iname}</td>
        <td>${ival}</td>
        <td>${oname}</td>
        <td>${oval}</td>
      </tr>
    `;
  }

  html += `</table>`;

  result.innerHTML = html;
}

// =====================
// error
// =====================
function showError(msg) {
  document.getElementById("progress").style.display = "none";
  document.getElementById("result").innerHTML =
    `<div class="error">${msg}</div>`;
}

</script>

</body>
</html>
