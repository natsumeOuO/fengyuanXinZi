<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="googlebot" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>~薪資單查詢~</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #fff;
    }

    .container {
      width: 90%;
      max-width: 700px;
      text-align: center;
    }

    .logo {
      width: 180px;
      margin-bottom: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    td {
      width: 25%;
      height: 40px;
      text-align: center;
      vertical-align: middle;
      font-size: 1.2em;
    }

    .error {
      color: red;
      font-weight: bold;
    }

    #progress-bar-container {
      display: none;
      width: 100%;
      background: #f3f3f3;
      border: 1px solid #ccc;
      margin-top: 10px;
      height: 20px;
      border-radius: 5px;
      overflow: hidden;
    }

    #progress-bar {
      width: 0%;
      height: 100%;
      background: #007bff;
      color: white;
      text-align: center;
      font-size: 1em;
    }
  </style>
</head>

<body>
<div class="container">

  <img class="logo" src="https://natsumeouo.github.io/fengyuanXinZi/LOGO%E9%80%8F%E6%98%8E%E5%BA%95.png">

  <form onsubmit="fetchPaySlip(); return false;">
    <input id="idNumber" placeholder="身分證">
    <input id="birthDate" placeholder="出生0780702">
    <input id="month" placeholder="11401">
    <button type="submit">查詢</button>
  </form>

  <div id="progress-bar-container">
    <div id="progress-bar">查詢中...</div>
  </div>

  <div id="downloadBtnContainer" style="display:none;">
    <button onclick="downloadImage()">下載薪資單</button>
  </div>

  <div id="result"></div>
</div>

<div id="paySlipForDownload" style="position:absolute;left:-9999px;width:700px;"></div>

<script>

let monthCache = {};

function fetchPaySlip() {

  var id = document.getElementById("idNumber").value;
  var dob = document.getElementById("birthDate").value;
  var month = document.getElementById("month").value;

  var resultDiv = document.getElementById("result");
  var progressBarContainer = document.getElementById("progress-bar-container");
  var progressBar = document.getElementById("progress-bar");

  resultDiv.innerHTML = "";

  progressBarContainer.style.display = "block";
  progressBar.style.width = "30%";

  // =====================
  // 防呆
  // =====================
  if (!/^[A-Z][12][0-9]{8}$/.test(id)) {
    showError("身分證格式錯誤");
    return;
  }

  if (!/^[0-9]{3}(0[1-9]|1[0-2])(0[1-9]|[12][0-9]|3[01])$/.test(dob)) {
    showError("出生日期格式錯誤");
    return;
  }

  if (!/^[0-9]{3}(0[1-9]|1[0-2])$/.test(month)) {
    showError("月份格式錯誤");
    return;
  }

  // =====================
  // cache
  // =====================
  if (monthCache[month]) {
    render(monthCache[month], id, dob, month);
    return;
  }

  fetch(month + ".json")
    .then(res => {
      if (!res.ok) throw new Error("JSON not found");
      return res.json();
    })
    .then(data => {

      if (!Array.isArray(data)) {
        throw new Error("JSON格式錯誤");
      }

      monthCache[month] = data;
      render(data, id, dob, month);
    })
    .catch(err => {
      console.error(err);
      showError("資料載入失敗（請檢查檔案）");
    });
}

// =====================
// render（安全版）
// =====================
function render(data, id, dob, month) {

  var resultDiv = document.getElementById("result");
  var progressBarContainer = document.getElementById("progress-bar-container");
  var progressBar = document.getElementById("progress-bar");

  try {

    progressBarContainer.style.display = "none";

    let map = {};

    data.forEach(item => {
      if (!item) return;

      let key = String(item.id || "").trim() + "_" + String(item.dob || "").trim();
      map[key] = item;
    });

    let searchKey = id.trim() + "_" + dob.trim();
    let user = map[searchKey];

    if (!user) {
      resultDiv.innerHTML = "<p class='error'>查無資料</p>";
      return;
    }

    let html = "<h2>姓名：" + (user.name || "-") + "</h2>";
    html += "<h3>月份：" + month + "</h3>";
    html += "<table border='1' style='width:100%;'>";

    (user.details || []).forEach(d => {

      let inc = d?.income || ["", ""];
      let exp = d?.expense || ["", ""];

      html += "<tr>";

      html += "<td>" + (inc[0] || "&nbsp;") + "</td>";
      html += "<td>" + (inc[1] || "&nbsp;") + "</td>";
      html += "<td>" + (exp[0] || "&nbsp;") + "</td>";
      html += "<td>" + (exp[1] || "&nbsp;") + "</td>";

      html += "</tr>";
    });

    html += "</table>";

    resultDiv.innerHTML = html;

    document.getElementById("paySlipForDownload").innerHTML = html;

    window.currentName = user.name || "";
    window.currentMonth = month;

    document.getElementById("downloadBtnContainer").style.display = "block";

  } catch (e) {
    console.error(e);
    showError("系統處理錯誤");
  }
}

// =====================
// error handler（統一）
// =====================
function showError(msg) {

  document.getElementById("progress-bar-container").style.display = "none";

  document.getElementById("result").innerHTML =
    "<p class='error'>" + msg + "</p>";
}

</script>
</body>
</html>
