<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="googlebot" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>~薪資單查詢~</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #fff;
    }

    .container {
      width: 90%;
      max-width: 700px;
      text-align: center;
    }

    .logo {
      width: 180px;
      margin-bottom: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    td {
      width: 25%;
      height: 40px;
      text-align: center;
      vertical-align: middle;
      font-size: 1.2em;
    }

    .error {
      color: red;
      font-weight: bold;
    }

    #progress-bar-container {
      display: none;
      width: 100%;
      background: #f3f3f3;
      border: 1px solid #ccc;
      margin-top: 10px;
      height: 20px;
      border-radius: 5px;
      overflow: hidden;
    }

    #progress-bar {
      width: 0%;
      height: 100%;
      background: #007bff;
      color: white;
      text-align: center;
      font-size: 1em;
    }
  </style>
</head>

<body>
<div class="container">

  <img class="logo" src="https://natsumeouo.github.io/fengyuanXinZi/LOGO%E9%80%8F%E6%98%8E%E5%BA%95.png">

  <form onsubmit="fetchPaySlip(); return false;">
    <input id="idNumber" placeholder="身分證">
    <input id="birthDate" placeholder="出生0780702">
    <input id="month" placeholder="11401">
    <button type="submit">查詢</button>
  </form>

  <div id="progress-bar-container">
    <div id="progress-bar">查詢中...</div>
  </div>

  <div id="downloadBtnContainer" style="display:none;">
    <button onclick="downloadImage()">下載薪資單</button>
  </div>

  <div id="result"></div>
</div>

<div id="paySlipForDownload" style="position:absolute;left:-9999px;width:700px;"></div>

<script>

let monthCache = {};

function fetchPaySlip() {

  var id = document.getElementById("idNumber").value;
  var dob = document.getElementById("birthDate").value;
  var month = document.getElementById("month").value;

  var resultDiv = document.getElementById("result");
  var progressBarContainer = document.getElementById("progress-bar-container");
  var progressBar = document.getElementById("progress-bar");

  resultDiv.innerHTML = "";
  progressBarContainer.style.display = "block";
  progressBar.style.width = "40%";

  // 驗證
  if (!/^[A-Z][12][0-9]{8}$/.test(id)) {
    resultDiv.innerHTML = "<p class='error'>身分證錯誤</p>";
    progressBarContainer.style.display = "none";
    return;
  }

  if (!/^[0-9]{3}(0[1-9]|1[0-2])(0[1-9]|[12][0-9]|3[01])$/.test(dob)) {
    resultDiv.innerHTML = "<p class='error'>生日錯誤</p>";
    progressBarContainer.style.display = "none";
    return;
  }

  if (!/^[0-9]{3}(0[1-9]|1[0-2])$/.test(month)) {
    resultDiv.innerHTML = "<p class='error'>月份錯誤</p>";
    progressBarContainer.style.display = "none";
    return;
  }

  // ⚡ cache
  if (monthCache[month]) {
    render(monthCache[month], id, dob, month);
    return;
  }

  fetch(month + ".json")
    .then(res => res.json())
    .then(data => {
      monthCache[month] = data;
      render(data, id, dob, month);
    })
    .catch(() => {
      resultDiv.innerHTML = "<p class='error'>載入失敗</p>";
      progressBarContainer.style.display = "none";
    });
}

function render(data, id, dob, month) {

  var resultDiv = document.getElementById("result");
  var progressBarContainer = document.getElementById("progress-bar-container");
  var progressBar = document.getElementById("progress-bar");

  let map = {};
  data.forEach(i => map[i.id + "_" + i.dob] = i);

  let user = map[id + "_" + dob];

  progressBarContainer.style.display = "none";

  if (!user) {
    resultDiv.innerHTML = "<p class='error'>查無資料</p>";
    return;
  }

  let html = "<h2>" + user.name + "</h2>";
  html += "<h3>" + month + "</h3>";
  html += "<table border='1'>";

  user.details.forEach(d => {
    html += "<tr>";

    if (d.income[0] === "所得部分" || d.income[0] === "備註") {
      html += "<td colspan='2'>" + d.income[0] + "</td>";
    } else {
      html += "<td>" + (d.income[0] || "") + "</td><td>" + (d.income[1] || "") + "</td>";
    }

    if (d.expense[0] === "支出部分") {
      html += "<td colspan='2'>" + d.expense[0] + "</td>";
    } else {
      html += "<td>" + (d.expense[0] || "") + "</td><td>" + (d.expense[1] || "") + "</td>";
    }

    html += "</tr>";
  });

  html += "</table>";

  resultDiv.innerHTML = html;
  document.getElementById("paySlipForDownload").innerHTML = html;

  window.currentName = user.name;
  window.currentMonth = month;

  document.getElementById("downloadBtnContainer").style.display = "block";
}

function downloadImage() {

  let el = document.getElementById("paySlipForDownload");

  let clone = el.cloneNode(true);

  clone.style.position = "fixed";
  clone.style.left = "-9999px";
  clone.style.width = "700px";
  clone.style.background = "#fff";

  document.body.appendChild(clone);

  html2canvas(clone, { scale: 2, useCORS: true }).then(canvas => {

    let a = document.createElement("a");
    a.download = "薪資單-" + (window.currentName || "") + "-" + window.currentMonth + ".png";
    a.href = canvas.toDataURL();
    a.click();

    document.body.removeChild(clone);
  });
}

</script>
</body>
</html>
